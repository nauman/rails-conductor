# GoReleaser for the conductor CLI.
#
# This CLI is a nested Go module in a Rails repo, and the two tools disagree
# about tag shape. Go requires `cli/v0.1.0` — `go install
# .../cli/cmd/conductor@v0.1.0` resolves from nothing else. GoReleaser OSS
# parses the current tag as semver and refuses a prefixed one; handling them is
# the Pro `monorepo:` feature.
#
# So bin/release-cli cuts BOTH tags on the same commit and points GoReleaser at
# the plain one. The version still travels in CLI_VERSION and every template
# below still uses {{ .Env.CLI_VERSION }} rather than {{ .Version }}: it is the
# single place the version is stated, and it stays correct whichever tag a
# future run is pointed at.
#
# Run it through `bin/release`, never by hand and never from a push hook. The
# gate is local and is the authority; a release is something a person decides.
version: 2

project_name: conductor

before:
  hooks:
    - go mod tidy
    # The licence is the repo's, and a second tracked copy is a second thing to
    # keep in step. `src: ../LICENSE` is not an option — GoReleaser globs archive
    # entries relative to the config, and a parent path fails to stat. So it is
    # copied in at build time and gitignored.
    - sh -c 'cp ../LICENSE LICENSE'
    # Shell completions are generated, not committed: a stale checked-in
    # completion is worse than none, because it confidently offers commands
    # that no longer exist.
    - sh -c 'mkdir -p completions && go run ./cmd/conductor completion bash > completions/conductor.bash'
    - sh -c 'go run ./cmd/conductor completion zsh > completions/conductor.zsh'
    - sh -c 'go run ./cmd/conductor completion fish > completions/conductor.fish'

builds:
  - id: conductor
    main: ./cmd/conductor
    binary: conductor
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      # Windows on ARM is not a platform anyone is operating a fleet from yet.
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/nauman/rails-conductor/cli/internal/version.Version=v{{.Env.CLI_VERSION}}
      - -X github.com/nauman/rails-conductor/cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/nauman/rails-conductor/cli/internal/version.Date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"  # reproducible builds

archives:
  - id: conductor
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Env.CLI_VERSION }}_{{ .Os }}_{{ .Arch }}
    # Named exactly, not globbed. GoReleaser runs from cli/, so `LICENSE*` matched
    # the repo root's copy not at all and warned five times per platform instead
    # of failing — a glob that matches nothing is not an error.
    # Named exactly, not globbed: `LICENSE*` was evaluated relative to cli/, where
    # it matched nothing, and a glob that matches nothing is a warning rather
    # than an error — so every archive shipped without a licence and said so five
    # times per platform in a log nobody read.
    files:
      - LICENSE
      - README.md
      - AGENTS.md
      - src: completions/*
        dst: completions

checksum:
  name_template: checksums.txt

nfpms:
  - id: conductor
    package_name: conductor
    formats: [deb, rpm]
    maintainer: Conductor
    description: CLI for operating a self-hosted Rails fleet through Conductor.
    license: MIT
    bindir: /usr/bin
    # THE DEFECT THAT FAILED TWO RELEASES. Everything above is templated on
    # .Env.CLI_VERSION because .Version carries the `cli/` tag prefix — but nfpms
    # was left on GoReleaser's DEFAULT name template, which uses .Version. So it
    # wrote `dist/conductor_cli/v0.1.0_linux_amd64.deb`: the slash became a
    # directory that does not exist, and the release died at the packaging step
    # with the tag already pushed. It is not that GoReleaser OSS cannot parse a
    # prefixed tag — it parses it fine; one template was missed.
    file_name_template: >-
      {{ .PackageName }}_{{ .Env.CLI_VERSION }}_{{ .Os }}_{{ .Arch }}
    contents:
      - src: completions/conductor.bash
        dst: /usr/share/bash-completion/completions/conductor
      - src: completions/conductor.zsh
        dst: /usr/share/zsh/site-functions/_conductor
      - src: completions/conductor.fish
        dst: /usr/share/fish/vendor_completions.d/conductor.fish

changelog:
  use: git
  sort: asc
  filters:
    # The Rails app and the CLI share a repo; only CLI work belongs in a CLI
    # changelog. Everything else is noise to whoever is reading a release note.
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  draft: false
  prerelease: auto  # a -rc or -beta tag releases as a prerelease on its own
  name_template: "conductor v{{ .Env.CLI_VERSION }}"
  header: |
    CLI for operating a self-hosted Rails fleet through Conductor.

    Install with Go:

        go install github.com/nauman/rails-conductor/cli/cmd/conductor@v{{ .Env.CLI_VERSION }}

    This release is tagged twice on one commit — `v{{ .Env.CLI_VERSION }}` and
    `cli/v{{ .Env.CLI_VERSION }}`. The prefixed one is what Go resolves for a
    nested module; you never type the prefix yourself.

# Deliberately NOT configured, rather than configured and broken:
#
#   brews / scoops — need a tap repository that does not exist yet.
#   cosign         — needs signing keys.
#   notarize       — needs an Apple Developer ID and credentials.
#
# Each would fail the release at the last step, which is the worst place to
# discover missing credentials. Add them when the inputs actually exist.
