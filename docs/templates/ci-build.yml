# Build this app's image in CI, and do NOTHING else.
#
# Drop this into an app repo as .github/workflows/build.yml, then record the
# filename on the app in Conductor (ci_build_workflow: "build.yml"). Conductor
# dispatches it with the exact commit it intends to ship, waits for the image, and
# then rolls it with `kamal deploy --skip-push`.
#
# WHY THE SPLIT: this job needs registry push and nothing more. No SSH key, no
# master key, no database password — a compromised runner can push an image, not
# reach production. Compare a workflow that runs the whole deploy, which must hold
# every secret the app has.
#
# The image MUST be tagged with the commit sha. A mutable tag like `latest` means
# the box cannot tell you what it runs, and Conductor's release identification has
# to guess — which it gets wrong.

name: Build image

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to build (Conductor passes this)
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR; drop if you push elsewhere
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry cache, not local: a fresh runner has no layer cache, and mode=max
      # keeps intermediate layers so the next run starts warm. This is what makes a
      # CI build competitive with building on a machine you keep running.
      - name: Build and push ${{ inputs.sha }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          # Kamal matches containers by this label; without it `kamal app logs`,
          # `exec` and `rollback` cannot find what they deployed.
          labels: service=${{ github.event.repository.name }}
