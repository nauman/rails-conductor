name: Deploy Conductor

# Conductor (the backbone) deploys itself via CI — a clean control machine — NOT
# via in-product self-deploy. This sidesteps the self-deploy inversion entirely:
# no self-kill, no stranded kamal locks, no rebuilding secrets from the DB.
#
# ── One-time setup (GitHub → Settings → Secrets and variables → Actions) ──
# Repository VARIABLES:
#   DEPLOY_SERVER_IP   e.g. 192.0.2.10
#   DEPLOY_SSH_USER    e.g. deploy
#   APP_HOST           conductor.pavelabs.io
# Repository SECRETS:
#   SSH_PRIVATE_KEY    private key authorized on the box (deploy user)
#   RAILS_MASTER_KEY   contents of config/master.key
#   DATABASE_PASSWORD
#   ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
#   ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
#   ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
#   SES_SMTP_USERNAME
#   SES_SMTP_PASSWORD
#   SENTRY_DSN                (may be blank)
#   CONDUCTOR_MCP_TOKEN
# (Registry auth uses the built-in GITHUB_TOKEN — no PAT needed; GHCR is same-owner.)

on:
  push:
    branches: [main]
    # NO paths-ignore. It was here to skip rebuilds on docs-only pushes, and it
    # silently skipped a REAL one: a PR whose branch had already merged main back
    # into itself produces a merge commit whose combined diff against its first
    # parent is EMPTY. Actions saw zero changed files, matched nothing outside the
    # ignore list, and never ran — so main carried undeployed code with no error
    # anywhere, and "merged" stopped implying "deployed".
    #
    # The asymmetry decides it: a wasted build on a docs push costs minutes, while
    # a silently skipped deploy costs however long it takes someone to notice.
  workflow_dispatch:

# Serializes GitHub Actions runs only. It does NOT prevent Conductor's in-product
# deploy path (webhook -> auto_deploy -> KamalDeployer) from deploying the same
# app concurrently — that race is what strands the kamal deploy lock. The fix for
# that lives in the app (self-deploy is refused), not here.
# See docs/learnings/deploy-lock-stranded-by-self-deploy.md
concurrency:
  group: deploy-conductor-production
  cancel-in-progress: false

jobs:
  deploy:
    # Don't deploy from forks.
    if: github.repository == 'nauman/rails-conductor'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the image to ghcr.io/<owner>/conductor via GITHUB_TOKEN
    env:
      DEPLOY_SERVER_IP: ${{ vars.DEPLOY_SERVER_IP }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
      APP_HOST: ${{ vars.APP_HOST }}
      # Mailer: verified SES sender + region. Without these the deploy.yml ERB
      # falls back to noreply@conductor.example.com / us-east-1 (both wrong) and
      # SES rejects every send. Non-secret, so they're repo variables.
      MAILER_FROM: ${{ vars.MAILER_FROM }}
      SES_SMTP_HOST: ${{ vars.SES_SMTP_HOST }}
      KAMAL_REGISTRY_SERVER: ghcr.io
      # The ghcr.io/nauman/conductor package is linked to this repo (Package settings
      # → Manage Actions access → rails-conductor: Write), so the ephemeral Actions
      # GITHUB_TOKEN can push. No stored registry credential — nothing to rotate.
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
      SES_SMTP_USERNAME: ${{ secrets.SES_SMTP_USERNAME }}
      SES_SMTP_PASSWORD: ${{ secrets.SES_SMTP_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      CONDUCTOR_MCP_TOKEN: ${{ secrets.CONDUCTOR_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The committed .kamal/secrets reads RAILS_MASTER_KEY via `$(cat config/master.key)`,
      # which is gitignored — materialize it from the secret.
      - name: Materialize master key
        run: |
          install -m 600 /dev/null config/master.key
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key

      - name: kamal deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Pin the box's host key and FAIL CLOSED if it's missing — a keyscan
          # fallback would be answerable by the same MITM the pin prevents.
          if [ -z "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS is not set. Pin the host key (ssh-keyscan -H <ip>) as a repo variable; refusing to deploy without host verification." >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          { echo "Host ${DEPLOY_SERVER_IP}"; echo "  StrictHostKeyChecking yes"; echo "  UserKnownHostsFile ~/.ssh/known_hosts"; } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          # Load the key into an agent IN THIS SHELL so kamal's net-ssh uses it
          # (passed via env + stdin — avoids interpolation/file-fidelity issues).
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_PRIVATE_KEY" | ssh-add -
          ssh-add -l
          # No `-d production` here. The destination overlay is a SELF-DESCRIBING
          # app's file (KamalConfig writes config/deploy.production.yml into the
          # checkout), and this repo carries only config/deploy.yml — so passing the
          # destination makes kamal exit before it does anything: "Configuration file
          # not found ... config/deploy.production.yml". Every code path guards this
          # on app.self_describing? for exactly that reason; CI must too. Commit the
          # overlay first if this repo is ever meant to deploy with a destination.
          bin/kamal deploy
          # Explicit, gated migration. The image entrypoint also runs db:prepare on
          # boot, but running it here makes migrations a visible, fail-loud step —
          # a failed migration fails the deploy instead of leaving prod's DB lagging
          # the code (recurring 500s). Idempotent: a no-op if already migrated.
          echo "=== db:migrate (gated) ==="
          bin/kamal app exec --reuse "bin/rails db:migrate"
          bin/kamal app exec --reuse "bin/rails db:abort_if_pending_migrations"

      - name: Verify /version
        run: |
          sleep 10
          for i in $(seq 1 20); do
            v=$(curl -s --max-time 10 "https://$APP_HOST/version" | grep -o "${GITHUB_SHA:0:7}" || true)
            if [ -n "$v" ]; then echo "✅ /version reports $v — deploy live"; exit 0; fi
            sleep 10
          done
          # FAIL, don't warn. Exiting 0 here made the job green and reported the
          # deploy as "succeeded" while the OLD code was still live — a silent
          # not-deployed. A transient propagation delay surfacing as a visible
          # failure is strictly better than a false success.
          echo "::error::/version did not report ${GITHUB_SHA:0:7} within ~3.5min — the intended release is NOT live."
          exit 1

      # Report THIS deploy back to Conductor so it becomes a real Deployment row
      # (Q-07-1). A CI deploy is otherwise invisible to the control plane, and
      # Conductor's own dashboard row reads stale forever. Runs on success AND
      # failure (if: always()) so a broken deploy is recorded as failed, not just
      # absent. No-ops when the two secrets aren't set, so it never fails a deploy.
      #   Repository SECRETS:
      #     CONDUCTOR_APP_ID                 Conductor's own App id in its DB
      #     CONDUCTOR_DEPLOY_WEBHOOK_SECRET  that App's webhook_secret (per-app HMAC)
      - name: Report deploy to Conductor
        if: always()
        env:
          CONDUCTOR_APP_ID: ${{ secrets.CONDUCTOR_APP_ID }}
          CONDUCTOR_DEPLOY_WEBHOOK_SECRET: ${{ secrets.CONDUCTOR_DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_RESULT: ${{ job.status }}   # 'success' | 'failure' | 'cancelled'
        run: |
          if [ -z "${CONDUCTOR_APP_ID:-}" ] || [ -z "${CONDUCTOR_DEPLOY_WEBHOOK_SECRET:-}" ]; then
            echo "Conductor report secrets not set — skipping self-report."; exit 0
          fi
          case "$DEPLOY_RESULT" in
            success) status=succeeded ;;
            *)       status=failed ;;   # failure OR cancelled — not a live release
          esac
          body=$(printf '{"status":"%s","commit_sha":"%s","release_version":"%s"}' \
                   "$status" "$GITHUB_SHA" "${GITHUB_SHA:0:7}")
          # HMAC-SHA256 over the RAW body, same scheme as the push webhook.
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$CONDUCTOR_DEPLOY_WEBHOOK_SECRET" | awk '{print $2}')"
          # Capture the STATUS, not just success/failure. "Could not report" with no
          # code is undiagnosable — 401 (wrong secret) and 404 (wrong app id) are
          # completely different fixes, and this warned identically for both on
          # every deploy for weeks.
          code=$(curl -sS --max-time 15 -o /tmp/report-body.txt -w '%{http_code}' \
                   -X POST "https://$APP_HOST/webhooks/$CONDUCTOR_APP_ID/deployment" \
                   -H "Content-Type: application/json" -H "X-Hub-Signature-256: $sig" \
                   --data "$body" || echo "000")

          case "$code" in
            2*) echo "Reported deploy ($status) to Conductor." ;;
            401) echo "::warning::Conductor rejected the deploy report: 401 unauthorized. " \
                      "CONDUCTOR_DEPLOY_WEBHOOK_SECRET does not match app $CONDUCTOR_APP_ID's webhook_secret." ;;
            404) echo "::warning::Conductor rejected the deploy report: 404 not found. " \
                      "CONDUCTOR_APP_ID ($CONDUCTOR_APP_ID) is not an app in Conductor." ;;
            000) echo "::warning::Could not reach Conductor to report the deploy (network/TLS)." ;;
            *)   echo "::warning::Conductor rejected the deploy report: HTTP $code — $(head -c 200 /tmp/report-body.txt)" ;;
          esac
