# Release the conductor CLI from hosted CI.
#
# This fires on NOTHING. There is no push or tag trigger, deliberately.
#
# The authority is the local gate: `bin/release-cli <version>` runs `make -C cli ci`,
# tags, pushes and publishes. This workflow exists so that path is ready if hosted
# CI is ever the better venue — not so a release can happen as a side effect of a
# push. A workflow that auto-fires and fails on a missing credential leaves a red
# mark nobody acts on, in the exact place a real failure would appear.
name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.1.0. The tag cli/v<version> must already exist."
        required: true
        type: string

permissions:
  contents: write # creating a release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs full history and tags

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # The same gate the local path runs. A hosted release that skipped it
      # would be a second, weaker standard for the same artifact.
      - name: Gate
        run: make -C cli ci

      # inputs.version reaches the shell through the ENVIRONMENT, never through
      # ${{ }} interpolation. Interpolating a dispatch input directly into a run
      # block lets anyone who can trigger the workflow inject shell that runs with
      # GITHUB_TOKEN. The format is validated before it is used for anything.
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::not a semver version: $VERSION"
            exit 1
          fi

      # The tag must exist AND point at the commit being built. Checking only
      # that it exists lets GoReleaser build this checkout while labelling the
      # release with an unrelated tag — a release whose contents are not what
      # its tag says.
      - name: Verify the tag matches this checkout
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="cli/v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag does not exist. Tag it first, or use bin/release-cli."
            exit 1
          fi
          tagged=$(git rev-list -n 1 "$tag")
          head=$(git rev-parse HEAD)
          if [ "$tagged" != "$head" ]; then
            echo "::error::$tag points at $tagged but this checkout is $head — refusing to publish a mismatched release."
            exit 1
          fi

      - name: Publish
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_VERSION: ${{ inputs.version }}
          GORELEASER_CURRENT_TAG: cli/v${{ inputs.version }}
