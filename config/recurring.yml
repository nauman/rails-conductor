# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

development:
  refresh_server_metrics:
    class: RefreshServerMetricsJob
    queue: ops
    schedule: every 5 minutes

  sync_container_status:
    class: SyncContainerStatusJob
    queue: ops
    schedule: every 2 minutes

  run_scheduled_backups:
    class: RunScheduledBackupsJob
    queue: ops
    schedule: every minute

  monitor_sites:
    class: MonitorSitesJob
    queue: ops
    schedule: every 5 minutes

  # Residue from a previous form (ADR 0004). Hourly, not per-minute: it SSHes to
  # every box, and the thing it looks for changes only when an app changes shape.
  # Preflight reads the stored rollup, so without this nothing ever populates it
  # and every app reports "never checked".
  sweep_residue:
    # `command:`, not `class:` — ResidueCheckJob#perform takes an app_id, so a
    # bare class entry would invoke it with none. The sweep fans out one job per
    # eligible app.
    command: "ResidueCheckJob.sweep"
    queue: ops
    schedule: every hour at minute 25

  # Does Conductor's record of what is deployed match what is actually running?
  # An app deployed by anything other than Conductor leaves the record frozen,
  # and a stale record is more dangerous than a missing one because it is
  # trusted. Offset from the residue sweep so the two do not SSH the same boxes
  # at the same moment.
  sweep_release_drift:
    command: "ReleaseDriftCheckJob.sweep"
    queue: ops
    schedule: every hour at minute 40

  # Conductor answers "which account owns this domain" from a cached zone list that
  # verify_cloudflare! writes and nothing else refreshed. Two of them sat 34 days
  # old, reporting a real domain as absent and a deleted one as present. Making the
  # staleness visible was not enough — a flag still needs a human to read it.
  #
  # Offset from the other sweeps so the three do not all reach out at once. Cheap:
  # one GET per credential, and a failure leaves the previous list in place.
  sweep_cloudflare_zones:
    command: "RefreshCloudflareZonesJob.sweep"
    queue: default
    schedule: every 6 hours at minute 20

  # Prove a backup actually restores. Nightly, and ONE per night: each restore
  # downloads a full dump and runs a postgres container, so verifying the whole
  # fleet at once is the same stampede that took backups down on 08-01. The
  # stalest backup goes first, so a never-tested one always precedes a re-check.
  # 04:30 — after the 03:00 backup window, well clear of it.
  verify_backup_restore:
    command: "VerifyBackupRestoreJob.sweep"
    queue: ops
    schedule: every day at 4:30am

  # SB-002 interim: callbacks can be bypassed, so detect the result. Daily is
  # enough — an ownerless org is not urgent, it is just invisible until someone
  # tries to manage members and finds they cannot.
  check_ownerless_organizations:
    class: OwnerlessOrganizationCheckJob
    queue: ops
    schedule: every day at 6am

