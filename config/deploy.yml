# Name of your application. Used to uniquely configure containers.
service: conductor

# Refuse to evaluate this file with an older Kamal binary. The deploy contract
# relies on Kamal 2's role-level proxy switch and app exec --reuse.
minimum_version: 2.10.1
# NOT `require_destination: true`. It would be right for a repo that carries a
# destination overlay, and this one does not: there is no config/deploy.production.yml
# and no .kamal/secrets.production, because every value here comes from CI's env.
# With the flag set, kamal refuses to evaluate the file at all — the deploy fails at
# config load, before a container is touched, and no destination-less invocation can
# succeed. Add the flag in the same change that commits the overlay, never before.
deploy_timeout: 30
drain_timeout: 30

# Name of the container image.
image: <%= ENV["KAMAL_REGISTRY_USERNAME"].presence || "your-user" %>/conductor

# Deploy to these servers.
servers:
  web:
    - <%= ENV["DEPLOY_SERVER_IP"].presence || "YOUR_SERVER_IP" %>

# Connect to the host as a non-root deploy user (set up with key auth + sudo).
ssh:
  user: <%= ENV["DEPLOY_SSH_USER"].presence || "deploy" %>

# Enable SSL auto certification via Let's Encrypt.
# Set Cloudflare SSL/TLS to "Full" if using Cloudflare.
proxy:
  ssl: true
  host: <%= ENV["APP_HOST"].presence || "conductor.example.com" %>
  app_port: 80
  forward_headers: true
  # kamal-proxy's --target-timeout, which defaults to 30s and OWNS the 504s the
  # MCP tools hit. Conductor is a control plane: `conductor_app action=runner`
  # and the read actions open an SSH connection to a fleet box and wait for a
  # command to finish, and 30s is a normal duration for that — a container exec
  # on a loaded box, a docker pull, a sweep across several apps.
  #
  # The 504 is generated BY THE PROXY, so Rails never sees the request finish and
  # cannot turn it into a JSON error. Worse, it is indistinguishable from success
  # for anything that mutates: a reclaim that had already run `swapoff` was cut
  # here, and the box lost a swap device (ADR 0005).
  #
  # Raising this is mitigation, not the fix — the fix is that a long operation
  # returns a job id instead of holding a request open.
  #
  # The cost is worse than "a hung request holds a connection longer", and an audit
  # named it: this runs 2 puma workers x 3 threads = SIX request slots, and every
  # synchronous runner call holds one for up to two minutes. A small burst can
  # starve /up, the UI, MCP and webhooks together. Raising the budget made the
  # failure rarer and its blast radius wider, on a control plane.
  #
  # Also caps any future move behind Cloudflare: its default origin read timeout is
  # 125s, so 120 leaves ~5s of headroom before a 524. This host is not proxied
  # today (no cf-ray), but Conductor is listed as proxyable.
  response_timeout: 120
  healthcheck:
    path: /up
    interval: 2
    timeout: 5

# Container registry (Docker Hub by default; override via KAMAL_REGISTRY_SERVER).
registry:
  server: <%= ENV["KAMAL_REGISTRY_SERVER"].presence || "docker.io" %>
  username: <%= ENV["KAMAL_REGISTRY_USERNAME"].presence || "your-user" %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_PASSWORD
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - SES_SMTP_USERNAME
    - SES_SMTP_PASSWORD
    - SENTRY_DSN
    - CONDUCTOR_MCP_TOKEN
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of cores available to the application on each server.
    WEB_CONCURRENCY: 2
    # NOTE: WORKER_TIMEOUT is deliberately NOT set here. It was raised to 120 on the
    # theory that puma's worker_timeout was a second request budget behind the
    # proxy's. It is not — it is a HEARTBEAT timeout, and a long request keeps
    # heartbeating from a separate thread, so it never bounded these calls and
    # raising it could not have helped. It only delayed recovery from a genuinely
    # wedged worker, fourfold, with two workers to lose.
    #
    # Set it only if production logs actually show puma "failed to check in"
    # terminations. Absent that evidence, the default is right.

    # Database connection (points at the Postgres accessory container below)
    DATABASE_HOST: <%= ENV["DATABASE_HOST"].presence || "conductor-postgres" %>
    DATABASE_USERNAME: <%= ENV["DATABASE_USERNAME"].presence || "conductor" %>
    DATABASE_NAME: conductor_production

    # Application host
    APP_HOST: <%= ENV["APP_HOST"].presence || "conductor.example.com" %>

    # Mailer (SES SMTP host; credentials come from secrets above)
    MAILER_FROM: <%= ENV["MAILER_FROM"].presence || "noreply@conductor.example.com" %>
    SES_SMTP_HOST: <%= ENV["SES_SMTP_HOST"].presence || "email-smtp.us-east-1.amazonaws.com" %>

    # Persist SSH known_hosts on the storage volume so TOFU host-key trust
    # survives container replacement (otherwise every deploy re-first-contacts).
    CONDUCTOR_KNOWN_HOSTS: /rails/storage/ssh/known_hosts

    # Storage
    AWS_REGION: <%= ENV["AWS_REGION"].presence || "us-east-1" %>
    S3_BUCKET: <%= ENV["S3_BUCKET"].presence || "conductor-storage" %>

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for Active Storage files.
volumes:
  - "conductor_storage:/rails/storage"

# Bridge fingerprinted assets between versions.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

# Shared Postgres on this host. This box is a multi-app server: run one cluster
# and give each app its own database/role. Container is reachable by other
# Kamal apps on the shared network as "conductor-postgres".
accessories:
  postgres:
    image: postgres:16
    host: <%= ENV["DEPLOY_SERVER_IP"].presence || "YOUR_SERVER_IP" %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: <%= ENV["DATABASE_USERNAME"].presence || "conductor" %>
        POSTGRES_DB: conductor_production
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - conductor_postgres_data:/var/lib/postgresql/data
